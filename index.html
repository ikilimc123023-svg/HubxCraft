<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HubxCraft | Web Portal</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        /* --- TASARIM AYARLARI (MAVİ TEMA) --- */
        :root {
            --hubx-cyan: #00d2ff;
            --hubx-blue: #3a7bd5;
            --bg: #050a14;
        }

        body {
            margin: 0;
            font-family: 'Poppins', sans-serif;
            background: radial-gradient(circle at center, #102040 0%, var(--bg) 100%);
            color: white;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Navbar */
        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 8%;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(10px);
            border-bottom: 2px solid var(--hubx-cyan);
        }

        .logo { 
            font-family: 'Orbitron'; 
            font-size: 24px; 
            color: var(--hubx-cyan); 
            text-shadow: 0 0 10px var(--hubx-cyan);
        }

        .nav-btn {
            background: transparent;
            color: var(--hubx-cyan);
            padding: 8px 20px;
            border: 2px solid var(--hubx-cyan);
            border-radius: 5px;
            cursor: pointer;
            font-weight: 600;
            transition: 0.3s;
        }

        .nav-btn:hover { background: var(--hubx-cyan); color: black; box-shadow: 0 0 15px var(--hubx-cyan); }

        /* Panel Kutuları */
        .container { flex: 1; display: flex; justify-content: center; align-items: center; }
        
        .card {
            background: rgba(255, 255, 255, 0.05);
            padding: 40px;
            border-radius: 20px;
            border: 1px solid rgba(0, 210, 255, 0.2);
            width: 380px;
            backdrop-filter: blur(15px);
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
            display: none; /* JS ile kontrol edilecek */
        }

        .card.active { display: block; animation: slideUp 0.5s ease; }

        h2 { text-align: center; color: var(--hubx-cyan); font-family: 'Orbitron'; margin-bottom: 25px; }

        input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border-radius: 8px;
            border: 1px solid rgba(255,255,255,0.1);
            background: rgba(0,0,0,0.4);
            color: white;
            outline: none;
            box-sizing: border-box;
        }

        input:focus { border-color: var(--hubx-cyan); }

        .action-btn {
            width: 100%;
            padding: 15px;
            margin-top: 15px;
            border: none;
            border-radius: 8px;
            background: linear-gradient(90deg, var(--hubx-cyan), var(--hubx-blue));
            color: white;
            font-weight: 700;
            cursor: pointer;
            transition: 0.3s;
        }

        .action-btn:hover { transform: scale(1.02); letter-spacing: 1px; }

        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

<nav>
    <div class="logo">HUBXCRAFT</div>
    <div id="nav-actions">
        <button class="nav-btn" onclick="switchTab('register-card')">Kayıt Ol</button>
    </div>
</nav>

<div class="container">
    <div id="register-card" class="card active">
        <h2>KAYIT OL</h2>
        <input type="text" id="reg-user" placeholder="Minecraft Kullanıcı Adın">
        <input type="password" id="reg-pass" placeholder="Şifre">
        <input type="password" id="reg-confirm" placeholder="Şifre Onay">
        <button class="action-btn" onclick="handleRegister()">HESABI OLUŞTUR</button>
    </div>

    <div id="profile-card" class="card">
        <h2>PROFİL</h2>
        <p style="text-align:center;">Hoş geldin, <b id="user-info" style="color:var(--hubx-cyan)"></b></p>
        <hr style="border:0.5px solid rgba(255,255,255,0.1); margin: 20px 0;">
        <input type="password" id="old-pass" placeholder="Eski Şifren">
        <input type="password" id="new-pass" placeholder="Yeni Şifre">
        <input type="password" id="new-confirm" placeholder="Yeni Şifre Onay">
        <button class="action-btn" onclick="handleUpdatePassword()" style="background:var(--hubx-blue)">ŞİFREYİ GÜNCELLE</button>
        <button onclick="logout()" style="width:100%; background:none; border:none; color:#ff4d4d; margin-top:15px; cursor:pointer;">Çıkış Yap</button>
    </div>
</div>

<script>
    /* --- TEK SCRIPT MANTIĞI --- */
    
    // Sayfa açıldığında giriş yapılmış mı kontrol et
    window.onload = () => {
        const savedUser = localStorage.getItem('hubx_name');
        if(savedUser) {
            showProfileUI(savedUser);
        }
    };

    function switchTab(id) {
        document.querySelectorAll('.card').forEach(c => c.classList.remove('active'));
        document.getElementById(id).classList.add('active');
    }

    function handleRegister() {
        const u = document.getElementById('reg-user').value;
        const p = document.getElementById('reg-pass').value;
        const c = document.getElementById('reg-confirm').value;

        if(!u || !p) return alert("Alanları doldur!");
        if(p !== c) return alert("Şifreler uyuşmuyor!");

        localStorage.setItem('hubx_name', u);
        localStorage.setItem('hubx_pass', p);

        alert("HubxCraft Kaydı Başarılı!\n\nŞimdi Minecraft'a gir ve şu komutu yaz:\n/onayla " + p);
        showProfileUI(u);
    }

    function showProfileUI(name) {
        document.getElementById('user-info').innerText = name;
        document.getElementById('nav-actions').innerHTML = `<button class="nav-btn" onclick="switchTab('profile-card')">PROFİLİM</button>`;
        switchTab('profile-card');
    }

    function handleUpdatePassword() {
        const storedPass = localStorage.getItem('hubx_pass');
        const oldP = document.getElementById('old-pass').value;
        const newP = document.getElementById('new-pass').value;
        const newC = document.getElementById('new-confirm').value;

        if(oldP !== storedPass) return alert("Eski şifren yanlış!");
        if(newP !== newC) return alert("Yeni şifreler tutmuyor!");
        if(newP.length < 4) return alert("Şifre çok kısa!");

        localStorage.setItem('hubx_pass', newP);
        alert("Şifren güncellendi! Oyuna girince yeni şifreni kullanmayı unutma.");
        
        // Temizle
        document.getElementById('old-pass').value = "";
        document.getElementById('new-pass').value = "";
        document.getElementById('new-confirm').value = "";
    }

    function logout() {
        localStorage.clear();
        location.reload();
    }
</script>

</body>
</html>
